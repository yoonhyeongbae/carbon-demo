name: Build Phase2 Windows Installer

on:
  push:
    branches: [flet-desktop-v1]
    paths:
      - "carbon_demo/flet_desktop/**"
      - ".github/workflows/build_phase2_windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: carbon_demo/flet_desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: carbon_demo/flet_desktop/pyproject.toml

      - name: Generate clean calculation core
        shell: pwsh
        run: python phase1_extract_core.py

      - name: Restore bundled sample ZIP
        shell: pwsh
        run: |
          $b64 = Get-Content -Raw "base_csv_upload_v21_1.zip.b64"
          [IO.File]::WriteAllBytes("base_csv_upload_v21_1.zip", [Convert]::FromBase64String($b64.Trim()))
          Write-Host "Sample ZIP bytes:" (Get-Item "base_csv_upload_v21_1.zip").Length

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.1" "numpy==2.3.2" "pandas==2.3.2" "geopy==2.4.1" "ortools==9.15.6755"
          python -c "import flet, numpy, pandas, geopy, ortools; print('dependency import PASS')"
          python -m py_compile legacy_core.py ev_optimizer_api.py main.py
          python -c "import main; print('main import PASS')"

      - name: Build Flet Windows app
        shell: pwsh
        run: |
          flet build windows . --python-version 3.13 --artifact EV_Carbon_Optimizer --product "EV Carbon Optimizer" --company "EV Carbon Optimizer" --build-version 0.2.0 --build-number 2 --output build/windows --yes --no-rich-output -v
          Get-ChildItem -Recurse build/windows | Select-Object FullName,Length
          if (-not (Test-Path "build/windows/EV_Carbon_Optimizer.exe")) { throw "Expected Flet executable was not created." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build single installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
          if (-not (Test-Path "dist/EV_Carbon_Optimizer_Phase2_Setup_0.2.0.exe")) { throw "Installer EXE was not created." }
          Get-FileHash "dist/EV_Carbon_Optimizer_Phase2_Setup_0.2.0.exe" -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EV_Carbon_Optimizer_Phase2_Setup_0.2.0
          path: carbon_demo/flet_desktop/dist/EV_Carbon_Optimizer_Phase2_Setup_0.2.0.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: EV_Carbon_Optimizer_Phase2_Portable
          path: carbon_demo/flet_desktop/build/windows/**
          if-no-files-found: error
          retention-days: 7
