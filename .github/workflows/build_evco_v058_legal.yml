name: Build EVCO v0.5.8 legal deliverables

on:
  push:
    branches:
      - chatgpt/evco-v0.5.8-build
    paths:
      - 'patches/v0.5.8/legal/**'
      - '.github/workflows/build_evco_v058_legal.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk zip
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python packages
        run: pip install python-docx reportlab
      - name: Generate legal package
        run: |
          python patches/v0.5.8/legal/generate_legal_docs.py
          python patches/v0.5.8/legal/generate_current_law_update.py
      - name: Upload legal package
        uses: actions/upload-artifact@v4
        with:
          name: EV_Carbon_Optimizer_v0.5.8_LEGAL_PACK
          path: dist/legal/*
          if-no-files-found: error
