[project]
name = "ev-carbon-optimizer-phase2"
version = "0.2.0"
description = "Phase-2 Flet desktop checkpoint for the EV carbon supply-chain optimizer"
requires-python = ">=3.13,<3.14"
dependencies = [
  "flet==0.86.1",
  "numpy==2.3.2",
  "pandas==2.3.2",
  "geopy==2.4.1",
  "ortools==9.15.6755",
]

[tool.flet]
product = "EV Carbon Optimizer"
company = "EV Carbon Optimizer"
build_number = 2

[tool.flet.app]
path = "."
module = "main.py"

[tool.flet.windows]
artifact = "EV_Carbon_Optimizer"
